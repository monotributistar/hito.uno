<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Esta pagina SI se busca y SI se comparte: a proposito NO lleva la meta
         robots que esconde de los buscadores. Esa meta vive solo en los
         perfiles (p/index.html) y en el panel. -->
    <meta name="theme-color" content="#eef1e8" />
    <meta name="description" content="Tarjeta, llavero, porta tarjetas, apoyavasos, placa y recibidor." />
    <!-- La vista previa al compartir por WhatsApp se arma con estas etiquetas, y
         se resuelven en el build: WhatsApp no ejecuta React, asi que el texto
         tiene que estar en el HTML. og:image va en JPEG porque WhatsApp no
         muestra webp, y con su tamaño declarado para que no recorte. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hito.uno/objetos" />
    <meta property="og:title" content="Objetos · Hito.uno" />
    <meta property="og:description" content="Tarjeta, llavero, porta tarjetas, apoyavasos, placa y recibidor." />
    <!-- PLACEHOLDER: imagen provisoria, muestra una pieza que todavia no esta impresa. -->
    <meta property="og:image" content="https://hito.uno/images/og/objetos.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dos tarjetas Hito.uno sobre fondo crema: el frente con el logo y el dorso con el codigo QR" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Objetos · Hito.uno</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/paginas/main-pagina.tsx"></script>
  </body>
</html>
